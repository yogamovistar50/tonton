name: Bangun APK Tonton

# Jalankan manual: tab Actions > "Bangun APK Tonton" > Run workflow. Hasilnya ada di bagian Artifacts.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang komponen SDK yang dibutuhkan
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Bangun APK (debug, sudah bertanda tangan debug sehingga bisa dipasang)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: Tonton-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unggah laporan build bila gagal (untuk diagnosis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-build-gagal
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
          if-no-files-found: ignore
